[project]
name = "enhanced-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "fastembed>=0.8.0",
    "langchain-anthropic>=1.5.3",
    "langchain-aws>=1.7.0",
    "langchain-core>=1.5.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.1.4",
    "langgraph>=1.2.10",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Repo-level unit tests only. Agent test suites are self-contained and run
# per-directory (that is also how the generation sandbox runs them):
#   uv run pytest agents/_shared/general_qa
testpaths = ["tests"]
pythonpath = ["."]
